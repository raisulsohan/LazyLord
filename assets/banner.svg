#bn-shine{opacity:0;animation:bn-shine 3.2s linear 0s 1 both}
#bn-back{opacity:0;animation:bn-back 3.2s ease-in-out 0s 1 both}
#bn-wipe{transform-box:fill-box;transform-origin:left center;animation:bn-wipe 3.2s linear 0s 1 both}
#bn-word{animation:bn-word 3.2s linear 0s 1 both}
