  <style>
#bn-stem{animation:bn-stem 3.2s cubic-bezier(.2,.8,.2,1) 0s 1 both}
#bn-foot{animation:bn-foot 3.2s cubic-bezier(.2,.8,.2,1) 0s 1 both}
