@keyframes bn-word{0%,54.688%{transform:translateX(-1.5px)}81.25%{transform:none}100%{transform:none}}
@media (prefers-reduced-motion:reduce){#bn-stem,#bn-foot,#bn-bridge,#bn-wipe,#bn-word,#bn-all{animation:none}#bn-pulse,#bn-shine,#bn-back{animation:none;opacity:0}}
#bn-spark{opacity:0;animation:bn-spark 4s linear 3.2s infinite both}
