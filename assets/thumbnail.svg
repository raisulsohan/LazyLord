<!--
  Figma Community thumbnail — 1920 x 1080 (the size Figma's publish form asks
  for; the README banner is the same artwork at 2:1). Rendered to PNG by
  `node tools/render-art.mjs`, so edit this rather than the PNG.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15121f"/>
      <stop offset="1" stop-color="#0d0b13"/>
    </linearGradient>
    <linearGradient id="mark" x1="820" y1="360" x2="1100" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8f74ff"/>
      <stop offset="1" stop-color="#5a3be0"/>
    </linearGradient>
    <linearGradient id="wire" x1="360" y1="500" x2="1560" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6c4cff" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#6c4cff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#6c4cff" stop-opacity=".15"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- The path a transfer takes, with a stop for each app. -->
  <path d="M360 500 H1560" stroke="url(#wire)" stroke-width="3"/>
  <g fill="#0d0b13" stroke="#6c4cff" stroke-width="3">
    <circle cx="360" cy="500" r="14"/>
    <circle cx="760" cy="500" r="14"/>
    <circle cx="1160" cy="500" r="14"/>
    <circle cx="1560" cy="500" r="14"/>
  </g>
  <g fill="#8b86a3" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="30" text-anchor="middle">
    <text x="360" y="576">Figma</text>
    <text x="760" y="576">Illustrator</text>
    <text x="1160" y="576">Photoshop</text>
    <text x="1560" y="576">After Effects</text>
  </g>

  <!-- Mark and wordmark. -->
  <path d="M960 256 L1044 340 L960 424 L876 340 Z" fill="url(#mark)"/>
  <path d="M960 292 L1008 340 L960 388 L912 340 Z" fill="#15121f"/>

  <text x="960" y="770" text-anchor="middle" fill="#ffffff"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="96" font-weight="700"
        letter-spacing="-2">LazyLord</text>
  <text x="960" y="836" text-anchor="middle" fill="#9a93b5"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="38">
    Vectors, live text and images — Figma to Adobe and back
  </text>
  <text x="960" y="906" text-anchor="middle" fill="#6f6885"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="28">
    Nothing leaves your machine
  </text>
</svg>
