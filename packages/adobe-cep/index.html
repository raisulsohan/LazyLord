<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LazyLord</title>

  <!--
    The one stylesheet, shared with the Figma plugin. `npm run build` syncs it
    from packages/ui-kit/lazylord.css — edit it there, not here.
  -->
  <link rel="stylesheet" href="./css/lazylord.css" />

  <style>
    /*
      Adobe panels are dark, and a CEP panel has no theme of its own to read,
      so the shared stylesheet's tokens are re-declared with Adobe's palette.
      Nothing below styles a component — only the colours they are drawn in.
    */
    :root {
      color-scheme: dark;
      --bg: #262626;
      --fg: #e8e8e8;
      --muted: #9a9a9a;
      --border: #1c1c1c;
      --accent: #6c4cff;
      --accent-fg: #fff;
      --ok: #45c26a;
      --err: #e5484d;
      --warn: #e0a23c;
      --chip: #2f2f2f;
      /* A docked panel is narrower than a plugin window, so chips wrap sooner,
         and the four scales still fit one row at the 240px minimum width. */
      --chip-min: 104px;
      --scale-min: 44px;
    }
    /* The chips sit on the panel's own surface rather than the window ground. */
    .a-target, .a-scale, .a-place, .a-opt select, .a-ghost { background: #1f1f1f; }
  </style>
</head>
<body>
  <div id="app">
    <header class="a-head">
      <div class="a-logo">
        <span class="a-mark">◆</span>
        <span class="a-title">LazyLord</span>
      </div>
      <div id="conn" class="a-conn a-conn--off"><span class="dot"></span><span id="conn-text">Offline</span></div>
    </header>

    <main class="a-body">
      <section class="a-block">
        <div class="a-host">
          <span class="a-host-name" id="host">Detecting host…</span>
          <span class="a-host-sub" id="host-sub"></span>
        </div>
      </section>

      <section class="a-block" id="push-card" hidden>
        <label class="a-label">Send to</label>
        <div id="push-targets" class="a-targets"></div>
        <p id="push-sub" class="a-peers">Send the selected artwork to another app.</p>
      </section>

      <section class="a-block" id="scale-card" hidden>
        <label class="a-label">Image scale</label>
        <div id="push-scales" class="a-scales" role="group" aria-label="Image export scale">
          <button class="a-scale" data-scale="1">1x</button>
          <button class="a-scale is-active" data-scale="2">2x</button>
          <button class="a-scale" data-scale="3">3x</button>
          <button class="a-scale" data-scale="4">4x</button>
        </div>
        <p class="a-peers">Used for anything sent as an image.</p>
      </section>

      <section class="a-block" id="destination-card" hidden>
        <label class="a-label" for="push-destination">Destination</label>
        <select id="push-destination" class="a-place" title="Where the receiving app builds the transfer.">
          <option value="active">Open document</option>
          <option value="page">New — source page size</option>
          <option value="selection">New — selection size</option>
        </select>
        <p id="push-dest-note" class="a-peers"></p>
      </section>

      <section class="a-block" id="options-card" hidden>
        <details class="a-opts" id="push-options">
          <summary class="a-label">Options <span class="a-count a-opts-note" id="push-opts-note"></span></summary>
          <div class="a-opt" title="Split: one layer per shape. Combine: shapes merged into as few layers as the destination allows. Text and images always stay separate.">
            <label for="push-layout">Layout</label>
            <select id="push-layout">
              <option value="split">Split</option>
              <option value="combine">Combine</option>
            </select>
          </div>
          <div class="a-opt" title="Flatten: groups dissolve into their layers. Groups: groups are rebuilt in the destination (Illustrator groups, Photoshop layer groups, After Effects parent nulls).">
            <label for="push-hierarchy">Hierarchy</label>
            <select id="push-hierarchy">
              <option value="flatten">Flatten</option>
              <option value="groups">Groups</option>
              <option value="precomps">Precomps (After Effects)</option>
            </select>
          </div>
          <div class="a-opt" title="Add: every send creates new layers. Update: layers an earlier send already built are edited where they stand, keeping their place in the stack. Layout and Hierarchy are ignored for those.">
            <label for="push-existing">Existing</label>
            <select id="push-existing">
              <option value="add">Add</option>
              <option value="update">Update</option>
            </select>
          </div>
          <div class="a-opt" id="push-keyframes-row" title="While updating in After Effects. Auto: a property that is already animated takes a new key at the playhead; a still one is just set. Always: every property is keyed, which is how you animate a shape by re-sending it." hidden>
            <label for="push-keyframes">Keyframes</label>
            <select id="push-keyframes">
              <option value="auto">Auto</option>
              <option value="always">Always</option>
            </select>
          </div>
          <div class="a-row" title="Also send the source page's ruler guides, and its named colours (swatches, colour styles). The receiving app adds what it can.">
            <label class="a-check"><input type="checkbox" id="push-guides" /> Include guides</label>
            <label class="a-check"><input type="checkbox" id="push-swatches" /> Include swatches</label>
          </div>
          <p class="a-peers" id="push-opts-hint"></p>
          <div class="a-opt" title="Destination, Image scale and the options above, saved under a name and brought back in one step.">
            <label for="push-preset">Preset</label>
            <select id="push-preset"><option value="">—</option></select>
          </div>
          <div class="a-row">
            <input type="text" id="push-preset-name" class="a-input" placeholder="Name these settings" maxlength="40" />
            <button id="push-preset-save" class="a-ghost">Save</button>
            <button id="push-preset-delete" class="a-ghost" disabled>Delete</button>
          </div>
        </details>
      </section>

      <section class="a-block" id="send-card" hidden>
        <button id="push" class="a-send" disabled>Send</button>
      </section>

      <section class="a-block" id="ae-tools" hidden>
        <label class="a-label">Precomps</label>
        <div class="a-row">
          <button id="ae-precompose" class="a-ghost" title="Move the selected layers into one precomp, keeping their attributes.">Precompose selected</button>
          <button id="ae-decompose" class="a-ghost" title="Move a selected precomp's layers into this comp, where they showed, and remove the precomp layer.">Decompose precomp</button>
        </div>
        <div class="a-row">
          <button id="ae-import-psd" class="a-ghost" title="Import the document open in Photoshop (its last saved version) as a composition with layer sizes kept. Without Photoshop connected, choose a file.">Import PSD from Photoshop</button>
        </div>
      </section>

      <section class="a-block">
        <div class="a-row">
          <label class="a-check" title="When off, transfers sent to this app are declined and the sender is told why.">
            <input type="checkbox" id="auto" checked /> Auto-receive
          </label>
          <button id="reconnect" class="a-ghost">Reconnect</button>
        </div>
      </section>

      <section class="a-block" id="diag-card" hidden>
        <label class="a-label" id="diag-head">
          <span id="diag-title">Fallbacks</span>
          <span class="a-count" id="diag-counts"></span>
        </label>
        <ul class="a-diags" id="diag-list"></ul>
      </section>

      <section class="a-block">
        <details class="a-opts" id="history">
          <summary class="a-label">History <span class="a-count" id="history-count"></span></summary>
          <ul class="a-diags" id="history-list"></ul>
          <div class="a-row"><span></span><button id="history-clear" class="a-ghost">Clear history</button></div>
        </details>
      </section>

      <section class="a-block">
        <label class="a-label">Log</label>
        <div id="log" class="a-log">Waiting for the LazyLord bridge…</div>
      </section>
    </main>

    <footer class="a-foot">
      <span>Bridge: <code>ws://127.0.0.1:7878</code></span>
      <span>data stays on this machine</span>
    </footer>
  </div>

  <script src="./js/csinterface.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
